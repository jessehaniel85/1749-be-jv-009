server:
  port: 8082

spring:
  application:
    name: cotacao-service
  datasource:
    url: jdbc:h2:mem:cotacaodb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # necessario para o data.sql rodar DEPOIS do Hibernate criar as tabelas
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

cotacao:
  # local (padrao, rede corporativa) | externo (awesomeapi, fora da rede)
  provedor: local
  externo:
    url: https://economia.awesomeapi.com.br

# Aula 6: registro no catalogo. O 'spring.application.name' acima e o NOME
# LOGICO pelo qual os outros servicos vao nos encontrar.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Padrao e 30s. Em aula, 5s: sem isso um servico recem-subido demora ate
    # meio minuto para ser ENXERGADO pelos outros (mesmo ja aparecendo no painel),
    # e a demonstracao vira espera constrangedora.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Em aula, renovacao rapida para o registro refletir Ctrl+C quase na hora.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
