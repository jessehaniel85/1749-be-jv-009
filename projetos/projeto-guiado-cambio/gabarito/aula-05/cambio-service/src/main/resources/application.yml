server:
  port: 8083

spring:
  application:
    name: cambio-service
  datasource:
    url: jdbc:h2:mem:cambiodb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Aula 5: descoberta "na mao". Cada vizinho e uma URL escrita aqui.
# Aula 6 troca isto por um nome logico resolvido pelo Eureka.
servicos:
  cliente:
    url: http://localhost:8081
  cotacao:
    url: http://localhost:8082
