spring:
  application:
    name: cambio-api

  # H2 em memória: some quando a aplicação para. Nenhuma infra externa é necessária.
  datasource:
    url: jdbc:h2:mem:cambio;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Console web do H2: http://localhost:8080/h2-console (JDBC URL igual à de cima).
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
