spring:
  application:
    name: cambio-api

  # H2 em memória: some quando a aplicação para. Nenhuma infra externa é necessária.
  datasource:
    url: jdbc:h2:mem:cambio;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    # Adia o data.sql para depois da criação das tabelas pelo Hibernate.
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Console web do H2: http://localhost:8080/h2-console (JDBC URL igual à de cima).
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# ---------------------------------------------------------------------------
# Provedor de cotação (Aula 4) — mesma interface, duas origens de dado.
#   local   (padrão)  tabela `cotacoes` no H2; PUT /cotacoes/{moeda} simula variação.
#   externo           awesomeapi via RestClient + AwesomeApiAdapter. Exige internet.
# Trocar a origem do dado é trocar UMA linha aqui — nenhuma classe de domínio muda.
# ---------------------------------------------------------------------------
cotacao:
  provedor: local
  externo:
    url: https://economia.awesomeapi.com.br/last
    timeout-segundos: 3
